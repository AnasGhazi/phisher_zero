<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phisher Zero</title>
  <link rel="stylesheet" href="tailwind.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="w-96 theme-light">
  <div class="min-h-screen">
    <!-- Header -->
    <header class="bg-primary text-secondary px-6 py-6 rounded-b-3xl shadow-2xl relative overflow-hidden">
      <div class="absolute inset-0 bg-gradient-to-r from-primary/80 to-primary opacity-90"></div>
      <div class="relative flex items-center gap-4">
        <div class="w-14 h-14 bg-secondary/20 backdrop-blur-sm rounded-2xl flex items-center justify-center shadow-lg border border-secondary/30">
          <img src="assets/icon48.png" alt="App Icon" class="w-10 h-10 rounded-lg" />
        </div>
        <div class="flex-1">
          <h1 class="text-2xl font-bold tracking-tight text-secondary">PHISHER ZERO</h1>
          <p class="text-secondary/90 text-sm font-medium">AI-Powered Email Phishing Detector</p>
        </div>
        <button id="darkModeToggle" class="w-10 h-10 rounded-xl bg-secondary/20 hover:bg-secondary/30 border border-secondary/30 flex items-center justify-center transition-all duration-200">
          <svg id="darkIcon" class="w-5 h-5 text-secondary hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
          </svg>
          <svg id="lightIcon" class="w-5 h-5 text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="px-6 py-6">
      <!-- Scan Status Box -->
      <div id="scanStatus" class="bg-card rounded-3xl shadow-lg p-6 mb-6 border border-border transition-all duration-300 backdrop-blur-sm">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-4">
            <div id="statusIcon" class="w-14 h-14 rounded-2xl bg-status-waiting flex items-center justify-center shadow-sm border border-border">
              <svg class="w-7 h-7 text-text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </div>
            <div class="flex-1">
              <p id="statusText" class="font-semibold text-text-primary text-base mb-1">Waiting to scan email</p>
              <p id="statusSubtext" class="text-sm text-text-secondary font-medium">Select an email to begin analysis</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Manual Input Section -->
      <div class="mb-6 space-y-3">
        <div class="flex flex-col gap-1">
          <label for="manualEmail" class="text-sm font-semibold text-text-secondary">Email Content (Optional)</label>
          <textarea id="manualEmail" rows="3" placeholder="Paste suspicious email text here..." class="w-full bg-card border border-border rounded-xl p-3 text-sm text-text-primary focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all duration-200 resize-none"></textarea>
        </div>
        <div class="flex flex-col gap-1">
          <label for="manualUrl" class="text-sm font-semibold text-text-secondary">Suspicious URL (Optional)</label>
          <input type="url" id="manualUrl" placeholder="https://example.com/login" class="w-full bg-card border border-border rounded-xl p-3 text-sm text-text-primary focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all duration-200" />
        </div>
        <p class="text-[0.75rem] text-text-secondary italic">Leave blank to automatically scan the current active webpage.</p>
      </div>

      <!-- Agent Breakdown -->
      <div id="agentBreakdown" class="hidden space-y-3 mb-6">
        <div class="flex items-center gap-2 mb-4">
          <div class="w-1 h-6 bg-secondary rounded-full"></div>
          <h2 class="text-lg font-bold text-text-primary">Agent Analysis</h2>
        </div>

        <!-- NLP Agent -->
        <div class="bg-card rounded-2xl shadow-sm p-4 border border-border hover:shadow-md hover:border-secondary/50 transition-all duration-200 group">
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-semibold text-text-primary text-sm">NLP Agent</h3>
            <span id="nlpScore" class="text-sm font-bold text-text-secondary px-2 py-1 rounded-lg bg-status-waiting">-</span>
          </div>
          <p id="nlpExplanation" class="text-sm text-text-secondary leading-relaxed">-</p>
        </div>

        <!-- URL Agent -->
        <div class="bg-card rounded-2xl shadow-sm p-4 border border-border hover:shadow-md hover:border-secondary/50 transition-all duration-200 group">
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-semibold text-text-primary text-sm">URL Agent</h3>
            <span id="urlScore" class="text-sm font-bold text-text-secondary px-2 py-1 rounded-lg bg-status-waiting">-</span>
          </div>
          <p id="urlExplanation" class="text-sm text-text-secondary leading-relaxed">-</p>
        </div>

        <!-- Ensemble Agent -->
        <div class="bg-gradient-to-br from-primary/20 to-primary/10 rounded-2xl shadow-sm p-4 border border-secondary/30 hover:shadow-md transition-all duration-200 group">
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-semibold text-text-primary text-sm">Ensemble Agent</h3>
            <span id="ensembleScore" class="text-sm font-bold text-secondary px-2 py-1 rounded-lg bg-secondary/20">-</span>
          </div>
          <p id="ensembleExplanation" class="text-sm text-text-primary leading-relaxed font-medium">-</p>
        </div>

        <!-- Explainer Agent -->
        <div class="bg-card rounded-2xl shadow-sm p-4 border border-border hover:shadow-md hover:border-secondary/50 transition-all duration-200 group">
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-semibold text-text-primary text-sm">Explainer Agent</h3>
          </div>
          <p id="explainerReasoning" class="text-sm text-text-secondary leading-relaxed italic">-</p>
        </div>
      </div>

      <!-- Button Row -->
      <div class="space-y-3">
        <button id="scanButton" class="w-full bg-gradient-to-r from-primary to-primary/90 hover:from-primary/90 hover:to-primary text-secondary font-semibold py-4 px-4 rounded-2xl shadow-lg hover:shadow-xl transition-all duration-200 flex items-center justify-center gap-2.5 transform hover:scale-[1.02] active:scale-[0.98] border border-secondary/20">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span>Scan Selected Email</span>
        </button>

        <button id="settingsButton" class="w-full bg-card hover:bg-card-hover text-text-primary font-medium py-3.5 px-4 rounded-2xl border border-border hover:border-secondary/50 shadow-sm hover:shadow-md transition-all duration-200 flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
          <span>Settings</span>
        </button>
      </div>
    </main>
  </div>

  <script src="scripts/api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
